server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Debug Header: If you see this, the Nginx container sent it.
    add_header X-Served-By "Nginx-Container" always;

    # Performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # 1. HARD LOCKDOWN for Static Files
    # If it's in /static/, Nginx MUST handle it. No redirects, no fallbacks to index.html.
    location /static/ {
        # If the file doesn't exist, return a hard 404 from Nginx
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, no-transform";
        add_header X-Served-By "Nginx-Container-Static" always;
    }

    # 2. React Router Fallback for non-file requests
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. Proxy API requests to Django
    location /api/ {
        proxy_pass http://django:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Proxy Auth
    location /accounts/ {
        proxy_pass http://django:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}