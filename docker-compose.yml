services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: math_stumper
      POSTGRES_USER: math_user
      POSTGRES_PASSWORD: math_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  django:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-debug-key-for-development
      - ALLOWED_HOSTS=*
      - POSTGRES_DB=math_stumper
      - POSTGRES_USER=math_user
      - POSTGRES_PASSWORD=math_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CORS_ALLOW_ALL_ORIGINS=True
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - django

volumes:
  postgres_data: